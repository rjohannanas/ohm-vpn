server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Only allow ACME challenge for Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;

    # TLS — Let's Encrypt certificates
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # TLS 1.3 only — older versions disabled intentionally
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS — instruct browsers to always use HTTPS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # ─── VPN WebSocket endpoint ────────────────────────────────────────────
    # Requests to /ws are proxied to the Rust VPN server (localhost:8080).
    # This path must match the --path argument in the client CLI.
    location /ws {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward real client IP for logging / rate limiting
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Increase timeouts for long-lived WebSocket connections
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;

        # Disable buffering for real-time packet forwarding
        proxy_buffering off;
    }

    # ─── Decoy web server ─────────────────────────────────────────────────
    # Serves a real website so the server looks legitimate to DPI.
    # Replace /var/www/html with actual web content.
    location / {
        root  /var/www/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options       "SAMEORIGIN"   always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header Referrer-Policy       "strict-origin" always;
    }
}
